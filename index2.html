<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Modal AI Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --c-primary: #007bff;
            --c-primary-hover: #0056b3;
            --c-bg: #f7f9fc;
            --c-bg-card: #ffffff;
            --c-border: #dee2e6;
            --c-shadow: rgba(0, 0, 0, 0.05);
            --c-shadow-hover: rgba(0, 0, 0, 0.1);
            --c-text-dark: #212529;
            --c-text-light: #555;
            --c-highlight-green: #2ecc71;
            --c-highlight-green-bg: rgba(46, 204, 113, 0.1);
            --c-error-red: #e74c3c;
            --c-error-red-bg: rgba(231, 76, 60, 0.15);
        }

        body.dark {
            --c-primary: #0088ff;
            --c-primary-hover: #339dff;
            --c-bg: #121212;
            --c-bg-card: #1e1e1e;
            --c-border: #333;
            --c-shadow: rgba(0, 0, 0, 0.2);
            --c-shadow-hover: rgba(0, 0, 0, 0.3);
            --c-text-dark: #f0f0f0;
            --c-text-light: #aaa;
            --c-highlight-green: #27ae60;
            --c-highlight-green-bg: rgba(46, 204, 113, 0.15);
            --c-error-red: #c0392b;
            --c-error-red-bg: rgba(231, 76, 60, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--c-bg);
            color: var(--c-text-dark);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- Header & Navigation --- */
        .page-header {
            max-width: 900px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .page-header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; color: var(--c-text-dark); }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            background: var(--c-bg-card);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid var(--c-border);
        }
        
        .nav-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            color: var(--c-text-light);
            transition: all 0.2s;
        }
        
        .nav-btn.active {
            background-color: var(--c-primary);
            color: white;
        }

        .page-footer { text-align: center; margin-top: 40px; font-size: 0.85rem; color: var(--c-text-light); }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2.5rem;
            background: var(--c-bg-card);
            border: 1px solid var(--c-border);
            border-radius: 16px;
            box-shadow: 0 10px 40px var(--c-shadow);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* View Switching */
        .view-section { display: none; }
        .view-section.active { display: block; }

        h2 { text-align: center; color: var(--c-text-light); font-weight: 500; margin-bottom: 2.5rem; }
        
        /* Dark Mode Toggle */
        .theme-switch-wrapper { display: flex; align-items: center; }
        .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: 0.3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: 0.3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--c-primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Generator Styles */
        #model-tray {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; padding: 1rem;
            background-color: var(--c-bg); border-radius: 12px; flex-wrap: wrap; transition: background-color 0.3s;
        }
        #model-tray input { display: none; }
        #model-tray label {
            display: flex; align-items: center; gap: 8px; padding: 10px 16px;
            border: 1px solid var(--c-border); border-radius: 20px; cursor: pointer;
            transition: all 0.2s ease; font-weight: 500; font-size: 0.9rem; color: var(--c-text-light);
        }
        #model-tray label:hover { border-color: var(--c-primary); color: var(--c-text-dark); }
        #model-tray input:checked + label {
            background-color: var(--c-primary); color: white; border-color: var(--c-primary);
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
        }

        .input-wrapper { position: relative; width: 100%; margin-bottom: 1rem; }
        textarea {
            width: 100%; height: 120px; padding: 12px; padding-right: 50px;
            box-sizing: border-box; border-radius: 8px; border: 1px solid var(--c-border);
            font-size: 16px; resize: vertical; font-family: 'Inter', sans-serif;
            background-color: var(--c-bg-card); color: var(--c-text-dark); transition: all 0.2s ease;
        }
        textarea:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1); }

        #mic-btn {
            position: absolute; bottom: 15px; right: 15px; background: none; border: none;
            cursor: pointer; font-size: 1.5rem; color: var(--c-text-light);
            transition: color 0.2s; padding: 0;
        }
        #mic-btn:hover { color: var(--c-primary); }
        #mic-btn.listening { color: var(--c-error-red); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        button#submit-btn {
            padding: 14px 20px; width: 100%; font-size: 16px; font-weight: 600; margin-bottom: 30px;
            background: linear-gradient(90deg, var(--c-primary), var(--c-primary-hover)); color: white;
            border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
        }
        button#submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 123, 255, 0.3); }

        /* Results & History Styles */
        #results-container, .history-entry-content { display: flex; flex-wrap: wrap; gap: 30px; margin-top: 20px; }
        #text-results, #image-results, .history-text-col, .history-image-col { flex: 1; min-width: 300px; }
        #text-results h2, #image-results h2 {
            font-size: 1.5rem; font-weight: 600; color: var(--c-text-dark); text-align: left;
            margin-bottom: 1rem; border-bottom: 1px solid var(--c-border); padding-bottom: 0.5rem;
        }
        #text-results-wrapper, .history-text-wrapper { display: flex; flex-wrap: wrap; gap: 20px; }

        .response-item {
            margin-bottom: 20px; background-color: var(--c-bg-card); padding: 20px; border-radius: 12px;
            transition: all 0.3s ease; flex: 1; min-width: 250px; border: 1px solid var(--c-border);
            box-shadow: 0 4px 20px var(--c-shadow); position: relative;
        }
        .response-item h3 { margin-top: 0; font-size: 1.1rem; font-weight: 600; color: var(--c-text-dark); display: flex; justify-content: space-between; align-items: center; }
        .response-item p { white-space: pre-wrap; margin-bottom: 0; line-height: 1.6; color: var(--c-text-light); }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; border-top: 1px solid var(--c-border); padding-top: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--c-text-light); transition: color 0.2s; padding: 4px; }
        .action-btn:hover { color: var(--c-primary); transform: scale(1.1); }
        
        .highlight { border-color: var(--c-highlight-green); box-shadow: 0 6px 25px var(--c-highlight-green-bg); }
        .highlight h3::after { content: '🏆 Best'; font-size: 12px; font-weight: 600; background-color: var(--c-highlight-green); color: white; padding: 4px 10px; border-radius: 20px; margin-left: 10px; }
        .error { border-color: var(--c-error-red); background-color: var(--c-error-red-bg); }
        
        #image-results img, .history-image-col img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--c-border); }

        /* History Specific Styles */
        #history-list { display: flex; flex-direction: column; gap: 30px; }
        .history-entry { border: 1px solid var(--c-border); border-radius: 12px; padding: 20px; background-color: var(--c-bg-card); }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--c-border); padding-bottom: 10px; margin-bottom: 15px; }
        .history-prompt { font-weight: 600; font-size: 1.1rem; color: var(--c-text-dark); }
        .history-meta { font-size: 0.85rem; color: var(--c-text-light); display: flex; align-items: center; gap: 15px; }
        .delete-btn { color: var(--c-error-red); cursor: pointer; background: none; border: none; font-size: 0.9rem; }
        .delete-btn:hover { text-decoration: underline; }
        #clear-history-btn { background-color: var(--c-error-red); color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; }

        .loading-container { display: flex; justify-content: center; align-items: center; min-height: 150px; width: 100%; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--c-border); border-top: 4px solid var(--c-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <header class="page-header">
            <div class="header-left">
                <h1>Multi-Modal AI</h1>
                <div class="nav-tabs">
                    <button class="nav-btn active" onclick="switchView('generate')">Generator</button>
                    <button class="nav-btn" onclick="switchView('history')">History</button>
                </div>
            </div>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="theme-toggle">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <main id="generate-view" class="app-container view-section active">
            <h2>Generate Text & Image from One Prompt</h2>

            <div id="model-tray">
                <input type="checkbox" id="model-gemini" checked>
                <label for="model-gemini">✍️ Gemini 1.5</label>
                
                <input type="checkbox" id="model-groq" checked>
                <label for="model-groq">✍️ Groq (Llama 3)</label>

                <input type="checkbox" id="model-openrouter" checked>
                <label for="model-openrouter">✍️ OpenRouter (Llama 3.2)</label>
                
                <input type="checkbox" id="model-image" checked>
                <label for="model-image">🖼️ Image</label>
            </div>

            <div class="input-wrapper">
                <textarea id="query-input" placeholder="Describe a story, a concept, or a scene... (or click the mic to speak)"></textarea>
                <button id="mic-btn" title="Voice Search">🎤</button>
            </div>
            
            <button id="submit-btn">Generate</button>
            
            <div id="results-container">
                <div id="text-results"></div>
                <div id="image-results"></div>
            </div>
        </main>

        <main id="history-view" class="app-container view-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Creation History</h2>
                <button id="clear-history-btn" onclick="clearHistory()">Clear All</button>
            </div>
            <div id="history-list">
                <p style="text-align: center; color: var(--c-text-light);">No history yet. Go generate something!</p>
            </div>
        </main>

        <footer class="page-footer">
            <p>© 2025 Multi-Modal AI Interface. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // --- Helper Function: Safely Escape Text for Attributes ---
        function escapeText(str) {
            if (!str) return '';
            return str
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '');
        }

        // --- Dark Mode Logic ---
        const themeSwitch = document.getElementById('theme-toggle');
        const body = document.body;
        function setTheme(isDark) {
            body.classList.toggle('dark', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        themeSwitch.addEventListener('change', () => setTheme(themeSwitch.checked));
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        themeSwitch.checked = savedTheme === 'dark' || (savedTheme === null && prefersDark);
        setTheme(themeSwitch.checked);

        // --- View Switching ---
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`${viewName}-view`).classList.add('active');
            const btnIndex = viewName === 'generate' ? 0 : 1;
            document.querySelectorAll('.nav-btn')[btnIndex].classList.add('active');
            
            if (viewName === 'history') {
                renderHistory();
            }
        }

        // --- History Management ---
        function saveToHistory(query, textResults, imageResult) {
            const entry = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                query: query,
                textResults: textResults,
                imageResult: imageResult
            };
            let history = JSON.parse(localStorage.getItem('appHistory') || '[]');
            history.unshift(entry);
            if (history.length > 20) history.pop();
            localStorage.setItem('appHistory', JSON.stringify(history));
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('appHistory') || '[]');
            
            if (history.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: var(--c-text-light);">No history yet. Go generate something!</p>';
                return;
            }

            historyList.innerHTML = history.map(item => {
                let textHtml = '';
                if (item.textResults && item.textResults.length > 0) {
                    textHtml = item.textResults.map(res => {
                        const safeAnswer = escapeText(res.answer);
                        return `
                        <div class="response-item" style="font-size: 0.9rem;">
                            <h3>${res.model} <span style="font-size: 0.8em; color: var(--c-text-light);">Score: ${res.score}</span></h3>
                            <p>${res.answer}</p>
                            <div class="action-buttons">
                                <button class="action-btn" onclick="speakText('${safeAnswer}')" title="Read Aloud">🔊</button>
                                <button class="action-btn" onclick="stopSpeaking()" title="Stop Speaking">⏹️</button>
                                <button class="action-btn" onclick="copyText('${safeAnswer}')" title="Copy">📋</button>
                            </div>
                        </div>
                    `}).join('');
                } else {
                    textHtml = '<p>No text generated.</p>';
                }

                let imageHtml = '';
                if (item.imageResult) {
                    imageHtml = `<img src="data:image/png;base64,${item.imageResult}" alt="Generated Image">`;
                } else {
                    imageHtml = '<p>No image generated.</p>';
                }

                return `
                    <div class="history-entry">
                        <div class="history-header">
                            <div>
                                <div class="history-prompt">"${item.query}"</div>
                                <div class="history-meta">${item.timestamp}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteHistoryItem(${item.id})">Delete</button>
                        </div>
                        <div class="history-entry-content">
                            <div class="history-text-col">
                                <div class="history-text-wrapper" style="display:flex; gap:10px; flex-wrap:wrap;">
                                    ${textHtml}
                                </div>
                            </div>
                            <div class="history-image-col">
                                ${imageHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem('appHistory') || '[]');
            history = history.filter(item => item.id !== id);
            localStorage.setItem('appHistory', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            if (confirm("Are you sure you want to clear all history?")) {
                localStorage.removeItem('appHistory');
                renderHistory();
            }
        }

        // --- Voice & TTS ---
        const micBtn = document.getElementById('mic-btn');
        const queryInput = document.getElementById('query-input');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('listening')) recognition.stop();
                else recognition.start();
            });
            recognition.onstart = () => { micBtn.classList.add('listening'); queryInput.placeholder = "Listening..."; };
            recognition.onend = () => { micBtn.classList.remove('listening'); queryInput.placeholder = "Describe a story..."; };
            recognition.onresult = (event) => { queryInput.value = event.results[0][0].transcript; };
            recognition.onerror = (event) => { micBtn.classList.remove('listening'); alert("Voice error: " + event.error); };
        } else {
             // Fallback: Show alert when clicked if not supported
             micBtn.addEventListener('click', () => alert("Sorry, Voice Search is not supported in this browser. Try Chrome or Edge."));
        }

        // --- TTS Helper Functions ---
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } else { alert("Text-to-speech not supported."); }
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
        
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => alert("Copied!")).catch(err => console.error("Copy failed", err));
        }

        // --- Core App Logic ---
        const submitButton = document.getElementById('submit-btn');
        const textResultsContainer = document.getElementById('text-results');
        const imageResultsContainer = document.getElementById('image-results');
        const checkGemini = document.getElementById('model-gemini');
        const checkGroq = document.getElementById('model-groq');
        const checkOpenRouter = document.getElementById('model-openrouter');
        const checkImage = document.getElementById('model-image');

        submitButton.addEventListener('click', async () => {
            const query = queryInput.value;
            if (!query) { alert("Please enter a description."); return; }

            const modelsToRun = {
                gemini: checkGemini.checked,
                groq: checkGroq.checked,
                openrouter: checkOpenRouter.checked,
                image: checkImage.checked
            };

            if (modelsToRun.gemini || modelsToRun.groq || modelsToRun.openrouter) {
                textResultsContainer.innerHTML = '<h2>Text Responses</h2><div class="loading-container"><div class="spinner"></div></div>';
            } else { textResultsContainer.innerHTML = ''; }
            
            if (modelsToRun.image) {
                imageResultsContainer.innerHTML = '<h2>Generated Image</h2><div class="loading-container"><div class="spinner"></div></div>';
            } else { imageResultsContainer.innerHTML = ''; }

            if (!Object.values(modelsToRun).some(v => v)) {
                alert("Please select at least one model.");
                textResultsContainer.innerHTML = ''; imageResultsContainer.innerHTML = ''; return;
            }

            try {
                const response = await fetch('/generate-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, models: modelsToRun }),
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const data = await response.json();

                // SAVE TO HISTORY
                saveToHistory(query, data.textResults, data.imageResult);

                if (data.textResults?.length > 0) {
                    const bestResult = data.textResults.reduce((best, current) => (current.score > best.score) ? current : best, { score: -Infinity });
                    
                    const textHtml = data.textResults.map(result => {
                        const isBest = result === bestResult && result.score > -999;
                        const highlightClass = isBest ? 'highlight' : '';
                        const safeAnswer = escapeText(result.answer);

                        if (result.error) {
                             return `<div class="response-item error ${highlightClass}"><h3>${result.model} (Score: ${result.score})</h3><p><strong>${result.answer}</strong></p></div>`;
                        }
                        return `
                            <div class="response-item ${highlightClass}">
                                <h3>${result.model} (Score: ${result.score})</h3>
                                <p>${result.answer}</p>
                                <div class="action-buttons">
                                    <button class="action-btn" onclick="speakText('${safeAnswer}')" title="Read Aloud">🔊</button>
                                    <button class="action-btn" onclick="stopSpeaking()" title="Stop Speaking">⏹️</button>
                                    <button class="action-btn" onclick="copyText('${safeAnswer}')" title="Copy">📋</button>
                                </div>
                            </div>`;
                    }).join('');
                    textResultsContainer.innerHTML = '<h2>Text Responses</h2><div id="text-results-wrapper">' + textHtml + '</div>';
                } else if (modelsToRun.gemini || modelsToRun.groq || modelsToRun.openrouter) {
                    textResultsContainer.innerHTML = '<h2>Text Responses</h2><p>No text responses were generated.</p>';
                }

                if (data.imageResult) {
                    imageResultsContainer.innerHTML = `<h2>Generated Image</h2><img src="data:image/png;base64,${data.imageResult}" alt="AI generated image">`;
                } else if (modelsToRun.image) {
                    imageResultsContainer.innerHTML = '<h2>Generated Image</h2><p>An image could not be generated.</p>';
                }

            } catch (error) {
                console.error("Error fetching AI responses:", error);
                textResultsContainer.innerHTML = '<h2>Error</h2><p>A major error occurred. Please check the console.</p>';
                imageResultsContainer.innerHTML = '';
            }
        });
    </script>
</body>
</html>
